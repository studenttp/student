<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر المكافآت 🎁</title>
<link rel="stylesheet" href="rewards.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="rewards-page">
<header>
<h1>🎁 متجر المكافآت</h1>
<p>حوّل نجومك إلى مكافآت مميزة! ⭐</p>
</header>
<div class="student-box">
<p>رصيدك الحالي</p>
<h2>⭐ <span id="studentPoints">0</span> نقطة</h2>
</div>
<div class="code-box">
<input
type="text"
id="studentCode"
placeholder="أدخل رمز الطالب">
<button onclick="loadStudent()">
عرض مكافآتي ⭐
</button>
</div>
<div id="studentMessage"></div>
<h2 class="section-title">
🛍️ المكافآت
</h2>
<div id="rewardsList" class="rewards-list">
جاري تحميل المكافآت...
</div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<script src="rewards.js"></script>
</body>
</html>
